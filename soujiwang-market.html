<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2b62f6" />
<title>行情 · 供求大厅复刻</title>
<style>
/* ============ 行情模块 · 小程序风格 ============ */
:root {
  --brand: #2b62f6;
  --brand2: #5b8cff;
  --brand-ink: #eaf1ff;
  --up: #f5333f;
  --down: #00a05a;
  --ink: #12161f;
  --ink2: #5a6474;
  --ink3: #98a2b3;
  --line: #eef1f6;
  --bg: #f4f6fa;
  --card: #fff;
  --r: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--ink);
  background: radial-gradient(120% 80% at 50% 0%, #3a4250 0%, #1d222b 60%, #14171d 100%);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.app {
  width: 100%; max-width: 430px; height: 100%; max-height: 932px;
  background: var(--bg); display: flex; flex-direction: column;
  position: relative; overflow: hidden;
  box-shadow: 0 30px 90px rgba(0, 0, 0, .55);
}
@media (min-width: 460px) and (min-height: 780px) {
  .app { border-radius: 26px; height: 94vh; }
}

/* ============ 顶部 ============ */
.hdr {
  flex: none; position: relative; z-index: 4;
  padding: 12px 14px 0;
  background: linear-gradient(150deg, #2f66f7 0%, #3f7bff 46%, #5b8cff 100%);
  color: #fff;
  box-shadow: 0 6px 18px rgba(43, 98, 246, .28);
}
.bar1 { display: flex; align-items: center; gap: 10px; }
.city {
  flex: none; display: flex; align-items: center; gap: 2px;
  border: 0; background: rgba(255, 255, 255, .16); color: #fff;
  font-size: 13.5px; font-weight: 600; padding: 6px 8px 6px 10px;
  border-radius: 999px; cursor: pointer; backdrop-filter: blur(4px);
}
.search {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px;
  background: rgba(255, 255, 255, .96); border-radius: 999px;
  padding: 7px 12px; color: var(--ink3);
  box-shadow: 0 2px 8px rgba(20, 40, 90, .12);
}
.search .mag { flex: none; color: #9aa6b8; }
.search input {
  flex: 1; min-width: 0; border: 0; background: none; outline: none;
  font-size: 13.5px; color: var(--ink);
}
.search input::placeholder { color: #a3adbd; }
.search input::-webkit-search-cancel-button { display: none; }
.clr {
  flex: none; border: 0; background: #dfe5ee; color: #6b7688;
  width: 17px; height: 17px; border-radius: 50%; font-size: 12px;
  line-height: 1; display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
}
.ic {
  flex: none; border: 0; background: rgba(255, 255, 255, .16);
  color: #fff; width: 34px; height: 34px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; backdrop-filter: blur(4px);
}
.ic:active, .city:active, .ghost:active { transform: scale(.96); }

.bar2 {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 10px; font-size: 11.5px; color: rgba(255, 255, 255, .88);
}
.live { display: flex; align-items: center; gap: 5px; }
.live i {
  width: 6px; height: 6px; border-radius: 50%; background: #5df2a8;
  box-shadow: 0 0 0 3px rgba(93, 242, 168, .22);
  animation: pulse 2s infinite;
}
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(93, 242, 168, 0); } }
.ghost {
  display: flex; align-items: center; gap: 3px;
  border: 0; background: rgba(255, 255, 255, .18); color: #fff;
  font-size: 11.5px; padding: 4px 9px; border-radius: 999px; cursor: pointer;
}

.cats {
  display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none;
  margin: 11px -14px 0; padding: 0 14px 12px;
}
.cats::-webkit-scrollbar { display: none; }
.cat {
  flex: none; border: 0; background: rgba(255, 255, 255, .17); color: #fff;
  font-size: 12.5px; padding: 6px 14px; border-radius: 999px;
  cursor: pointer; white-space: nowrap; transition: .18s;
}
.cat b { font-weight: 400; opacity: .62; font-size: 10.5px; margin-left: 4px; }
.cat.on {
  background: #fff; color: var(--brand); font-weight: 700;
  box-shadow: 0 4px 12px rgba(10, 30, 80, .18);
}
.cat.on b { opacity: .45; }

/* ============ 主体 ============ */
main {
  flex: 1; min-height: 0; min-width: 0;
  display: grid; grid-template-columns: 92px minmax(0, 1fr);
  overflow: hidden;
}
main > * { min-width: 0; }

.brands {
  overflow-y: auto; overflow-x: hidden;
  background: #eef1f7; padding: 8px 0 92px;
  scrollbar-width: none;
}
.brands::-webkit-scrollbar { display: none; }
.brand {
  position: relative; width: 100%; border: 0; background: none;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 12px 2px; font-size: 12px; color: var(--ink2); cursor: pointer;
  transition: .16s;
}
.brand b { font-weight: 500; line-height: 1.25; }
.brand small { font-size: 10px; color: #aab4c4; }
.brand.on {
  background: var(--bg); color: var(--brand); font-weight: 700;
}
.brand.on small { color: rgba(43, 98, 246, .55); }
.brand.on::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px; border-radius: 0 3px 3px 0; background: var(--brand);
}

.content { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.toolbar {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 9px 12px 7px;
}
.cnt {
  flex: 1; min-width: 0; font-size: 11.5px; color: var(--ink3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.seg {
  flex: none; display: flex; background: #e7ebf3; border-radius: 9px; padding: 2px;
}
.seg button {
  border: 0; background: none; color: var(--ink2); font-size: 11.5px;
  padding: 4px 10px; border-radius: 7px; cursor: pointer; transition: .16s;
}
.seg button.on {
  background: #fff; color: var(--brand); font-weight: 700;
  box-shadow: 0 1px 4px rgba(20, 40, 90, .12);
}

.rows { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 12px 100px; scrollbar-width: none; }
.rows::-webkit-scrollbar { display: none; }

/* 系列头 */
.shead {
  display: flex; align-items: center; gap: 5px; overflow: hidden; white-space: nowrap;
  padding: 13px 2px 7px; font-size: 11.5px; color: var(--ink3);
}
.shead .sbrand { font-size: 13px; font-weight: 800; color: var(--ink); letter-spacing: .2px; }
.shead .ssep { color: #c3cbd8; }
.shead .sname { font-size: 12.5px; color: #48505f; font-weight: 600; }
.shead .badge {
  font-size: 9.5px; padding: 1px 5px; border-radius: 4px;
  background: #eef1f7; color: #7b8496; border: 1px solid #e3e8f0;
}
.shead .badge.agency { background: #fff5e9; color: #c9761a; border-color: #ffe3c4; }
.shead .badge.wholesale { background: #e9f9f1; color: #0a8b53; border-color: #c8eedd; }
.shead .scount { margin-left: auto; font-size: 10.5px; color: #b3bcCB; padding-left: 8px; }

/* 机型卡 */
.card {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border-radius: var(--r);
  padding: 11px 12px; margin-bottom: 8px;
  box-shadow: 0 1px 2px rgba(20, 35, 70, .045), 0 4px 14px rgba(20, 35, 70, .035);
  cursor: pointer; transition: transform .14s, box-shadow .14s;
  animation: rise .28s both;
}
.card:active { transform: scale(.985); box-shadow: 0 1px 6px rgba(20, 35, 70, .1); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.thumb {
  flex: none; width: 42px; height: 42px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 15px; font-weight: 800; letter-spacing: -.5px;
  box-shadow: inset 0 -6px 12px rgba(0, 0, 0, .08);
}
.thumb.sm { font-size: 12px; }
.mid { flex: 1; min-width: 0; }
.mid h4 {
  margin: 0; font-size: 14px; font-weight: 650; line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mid h4 .sto {
  font-size: 11px; font-weight: 600; color: var(--brand);
  background: var(--brand-ink); padding: 1px 5px; border-radius: 4px;
  margin-left: 4px; vertical-align: 1px;
}
.mid h4 .star { color: #ffab00; margin-right: 3px; font-size: 12px; }
.tags { display: flex; gap: 4px; margin-top: 5px; overflow: hidden; }
.tag {
  font-size: 10px; line-height: 1.5; padding: 0 5px; border-radius: 4px;
  background: #f2f4f8; color: #8a93a3; white-space: nowrap;
}
.tag.warn { background: #fff1f0; color: #e0121f; }
.tag.ok { background: #e9f9f1; color: #0a8b53; }
.tag.agency { background: #fff5e9; color: #c9761a; }
.tag.wholesale { background: #e9f9f1; color: #0a8b53; }
.tag.gray { background: #f2f4f8; color: #98a2b3; }

.price { flex: none; text-align: right; min-width: 84px; }
.price strong {
  display: block; font-size: 19px; font-weight: 750; letter-spacing: -.4px;
  line-height: 1.1; font-variant-numeric: tabular-nums; color: #141a24;
}
.price strong small { font-size: 10.5px; font-weight: 600; color: #9aa4b4; margin-left: 1px; letter-spacing: 0; }
.price strong.masked { color: #4b5566; }
.price strong.masked small { color: #b3bccb; }
.delta { display: block; font-size: 10.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta.flat { color: #aab4c4; }
.range { display: block; font-size: 10px; color: #aab4c4; margin-top: 2px; font-variant-numeric: tabular-nums; }
.card.dead .price strong { font-size: 13px; font-weight: 600; color: #aab4c4; }
.card.dead .thumb { filter: grayscale(.55); opacity: .72; }

.empty { padding: 56px 24px; text-align: center; color: var(--ink3); font-size: 13px; line-height: 1.9; }
.empty svg { opacity: .5; margin-bottom: 10px; }
.foot { padding: 14px 4px 30px; color: #aab4c4; font-size: 10.5px; line-height: 1.8; }

/* ============ 底部 tab ============ */
.tabbar {
  flex: none; position: relative; z-index: 5;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: rgba(255, 255, 255, .96); backdrop-filter: blur(12px);
  border-top: 1px solid #eef1f6; padding: 7px 0 calc(7px + env(safe-area-inset-bottom));
}
.tabbar button {
  border: 0; background: none; display: flex; flex-direction: column;
  align-items: center; gap: 2px; color: #a8b1c0; cursor: pointer; padding: 0;
  font-size: 10px; transition: .16s;
}
.tabbar button i { font-style: normal; }
.tabbar button.on { color: var(--brand); }
.tabbar button.on i { font-weight: 600; }
.tabbar .fab { justify-content: flex-end; }
.tabbar .fab span {
  width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(140deg, #3f7bff, #1f4fe0);
  color: #fff; font-size: 15px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  margin-top: -22px; box-shadow: 0 8px 20px rgba(43, 98, 246, .42);
  border: 3px solid #fff; transition: transform .15s;
}
.tabbar .fab:active span { transform: scale(.94); }

/* ============ 抽屉 ============ */
.mask {
  position: absolute; inset: 0; background: rgba(10, 14, 22, .45);
  z-index: 8; animation: fade .18s ease;
}
@keyframes fade { from { opacity: 0 } }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 9;
  background: #fff; border-radius: 20px 20px 0 0;
  max-height: 88%; overflow-y: auto; padding: 0 0 24px;
  animation: up .26s cubic-bezier(.22, .94, .3, 1);
  scrollbar-width: none;
}
.sheet::-webkit-scrollbar { display: none; }
@keyframes up { from { transform: translateY(14%); } }
.grab { width: 38px; height: 4px; border-radius: 2px; background: #e4e8ef; margin: 8px auto 0; }

/* 详情头 */
.dh { padding: 16px 18px 18px; color: var(--ink); position: relative; overflow: hidden; }
.dh::after {
  content: ''; position: absolute; right: -46px; top: -60px;
  width: 160px; height: 160px; border-radius: 50%;
  background: rgba(255, 255, 255, .5);
}
.dh-name { font-size: 18px; font-weight: 750; letter-spacing: .2px; }
.dh-price {
  margin-top: 8px; font-size: 31px; font-weight: 800; letter-spacing: -1.2px;
  font-variant-numeric: tabular-nums; line-height: 1.05; color: #12161f;
}
.dh-price span { font-size: 13px; font-weight: 600; margin-left: 4px; color: #6b7688; letter-spacing: 0; }
.dh-sub { margin-top: 8px; font-size: 11.5px; color: #6b7688; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dh-sub .pill { background: #fff; border: 1px solid #e6ebf3; padding: 1px 7px; border-radius: 999px; color: #4a5361; font-weight: 600; }

.spark-box { padding: 14px 18px 4px; }
.spark-box h5 { margin: 0 0 6px; font-size: 11.5px; color: var(--ink3); font-weight: 500; display: flex; justify-content: space-between; }
.spark-box h5 em { font-style: normal; color: #c2cad6; }
canvas.spark { width: 100%; height: 62px; display: block; }

.sec { padding: 16px 18px 4px; font-size: 12.5px; font-weight: 700; color: var(--ink); }
.sec span { font-weight: 400; font-size: 11px; color: var(--ink3); margin-left: 5px; }
.colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; padding: 8px 18px 0; }
.cchip {
  border: 1px solid #eef1f6; background: #fafbfd; border-radius: 10px;
  padding: 8px 10px; display: flex; flex-direction: column; gap: 2px;
}
.cchip em { font-style: normal; font-size: 11.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cchip b { font-size: 15px; font-variant-numeric: tabular-nums; }
.cchip.dead { background: #fbfbfc; }
.cchip.dead b { color: #b3bccb; font-size: 11.5px; font-weight: 500; }

.kv { margin: 6px 18px 0; }
.kv div {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 9px 0; border-bottom: 1px solid #f4f6fa; font-size: 12.5px;
}
.kv span { color: var(--ink3); flex: none; }
.kv b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

pre.raw {
  margin: 8px 18px 0; background: #f7f8fb; border: 1px solid #eef1f6;
  border-radius: 10px; padding: 11px 12px; font-size: 12px; line-height: 1.7;
  white-space: pre-wrap; word-break: break-all; color: #4a5361;
  font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
}

.acts {
  display: flex; gap: 10px; padding: 20px 18px 8px; margin-top: 4px;
}
.acts button {
  flex: 1; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 650;
  border: 1px solid #e8ecf3; background: #fff; color: var(--ink); cursor: pointer;
  transition: .15s;
}
.acts button.primary {
  background: linear-gradient(140deg, #3f7bff, #2454df); border-color: transparent; color: #fff;
  box-shadow: 0 6px 16px rgba(43, 98, 246, .3);
}
.acts button.watched { background: #fff8e8; border-color: #ffe0a8; color: #b8730a; }
.acts button:active { transform: scale(.98); }

/* 原文视图 */
.rawsheet { padding: 6px 16px 24px; }
.rawsheet h3 { margin: 8px 0 2px; font-size: 16px; }
.rawsheet .note { font-size: 11.5px; color: var(--ink3); margin-bottom: 10px; }
.rgroup { margin-top: 12px; }
.rgroup h6 {
  margin: 0 0 4px; font-size: 11.5px; color: var(--brand); font-weight: 700;
  display: flex; align-items: center; gap: 6px;
}
.rgroup h6::after { content: ''; flex: 1; height: 1px; background: #f0f3f8; }
.rgroup pre {
  margin: 0; font-size: 11.5px; line-height: 1.75; color: #5b6474;
  white-space: pre-wrap; word-break: break-all;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}

/* 筛选面板 */
.fsheet { padding: 4px 18px 24px; }
.fsheet h3 { margin: 8px 0 2px; font-size: 16px; }
.fsheet .note { font-size: 11.5px; color: var(--ink3); }
.fgroup { margin-top: 16px; }
.fgroup h4 { margin: 0 0 9px; font-size: 12.5px; color: var(--ink2); font-weight: 650; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt {
  border: 1px solid #e8ecf3; background: #fff; border-radius: 9px;
  padding: 8px 13px; font-size: 12.5px; color: var(--ink2); cursor: pointer;
  transition: .15s;
}
.opt i { font-style: normal; opacity: .4; font-size: 10.5px; margin-left: 4px; }
.opt.on { background: var(--brand-ink); border-color: #c2d6ff; color: var(--brand); font-weight: 650; }
.facts { display: flex; gap: 10px; margin-top: 22px; }
.facts button {
  flex: 1; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 650;
  border: 1px solid #e8ecf3; background: #fff; color: var(--ink); cursor: pointer;
}
.facts button.primary { background: linear-gradient(140deg, #3f7bff, #2454df); border-color: transparent; color: #fff; }

/* 骨架 */
.sk-card { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: var(--r); padding: 11px 12px; margin-bottom: 8px; }
.sk { background: linear-gradient(90deg, #eef1f6 25%, #f7f9fc 37%, #eef1f6 63%); background-size: 400% 100%; animation: shine 1.3s infinite; border-radius: 5px; }
@keyframes shine { from { background-position: 100% 0 } to { background-position: 0 0 } }

/* toast */
.toast {
  position: absolute; left: 50%; bottom: 104px; transform: translate(-50%, 8px);
  background: rgba(18, 22, 31, .92); color: #fff; font-size: 12.5px;
  padding: 9px 16px; border-radius: 999px; z-index: 30;
  max-width: 84%; text-align: center; pointer-events: none;
  opacity: 0; transition: opacity .22s, transform .22s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

</style>
</head>
<body>
<div class="app" id="app">

  <header class="hdr">
    <div class="bar1">
      <button class="city" id="btnCity">
        郑州<svg viewBox="0 0 24 24" width="12" height="12"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" class="mag"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-3.6-3.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="搜型号 / 品牌 / 颜色" autocomplete="off" />
        <button id="btnClear" class="clr" hidden>×</button>
      </label>
      <button class="ic" id="btnRaw" aria-label="报价原文">
        <svg viewBox="0 0 24 24" width="19" height="19"><path d="M6 3h9l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12h7M9 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="bar2">
      <span class="live"><i></i><span id="dateText">11.21</span> 结算价 · 今日已更新</span>
      <button class="ghost" id="btnFilter">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M3 6h18M6 12h12M10 18h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        筛选
      </button>
    </div>

    <nav class="cats" id="cats"></nav>
  </header>

  <main>
    <aside class="brands" id="brands"></aside>
    <section class="content">
      <div class="toolbar">
        <span class="cnt" id="countText">—</span>
        <div class="seg" id="segSort">
          <button data-sort="default" class="on">默认</button>
          <button data-sort="asc">低价</button>
          <button data-sort="desc">高价</button>
        </div>
      </div>
      <div class="rows" id="rows"></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 10.5L12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <i>首页</i>
    </button>
    <button data-tab="market" class="on">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 19V10M9.3 19V5M14.7 19v-6M20 19v-3" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
      <i>行情</i>
    </button>

<script>
/* 行情模块 · 小程序风格交互 */
(() => {
  const D = window.MARKET_DATA;
  const $ = s => document.querySelector(s);
  if (!D) {
    $('#rows').innerHTML = '<div class="empty">数据未加载：先运行 <code>node parse.mjs</code></div>';
    return;
  }

  /* ---------------- 数据 ---------------- */
  const ITEMS = [];
  D.series.forEach(s => s.items.forEach(it => ITEMS.push({
    ...it,
    category: s.category, brand: s.brand, series: s.series,
    seriesKey: s.key, typeKey: s.type, typeLabel: s.typeLabel,
  })));

  const CATS = ['全部', ...D.categories];
  const BRANDS = ['全部', ...D.brands];

  // 品牌色：批发圈里认牌子靠颜色，做成一眼能分
  const BRAND = {
    '小米': [[255, 106, 0], [255, 154, 60]],
    '红米': [[255, 77, 79], [255, 120, 117]],
    '苹果': [[58, 63, 74], [107, 114, 128]],
    '华为': [[211, 47, 47], [239, 83, 80]],
    '荣耀': [[10, 132, 255], [90, 174, 255]],
    'iQOO': [[27, 108, 255], [77, 141, 255]],
    'vivo': [[75, 94, 252], [123, 140, 255]],
    'OPPO': [[18, 183, 106], [50, 213, 131]],
    '一加': [[235, 0, 32], [255, 77, 77]],
    '真我': [[255, 184, 0], [255, 213, 79]],
    '联想': [[226, 35, 26], [255, 90, 79]],
    '华硕': [[0, 83, 155], [45, 127, 214]],
    '机械革命': [[31, 41, 55], [75, 85, 99]],
    '来酷': [[14, 165, 233], [56, 189, 248]],
    '罗技': [[11, 123, 208], [59, 158, 232]],
    '索尼': [[17, 24, 39], [63, 70, 82]],
    '大疆': [[31, 41, 55], [75, 85, 99]],
    '影石': [[249, 115, 22], [251, 146, 60]],
    '任天堂': [[228, 0, 15], [255, 77, 94]],
    '戴森': [[124, 58, 237], [167, 139, 250]],
  };
  const thumbStyle = b => {
    const c = BRAND[b] || [[90, 100, 116], [140, 150, 168]];
    return `background:linear-gradient(140deg,rgb(${c[0]}) 0%,rgb(${c[1]}) 100%)`;
  };
  const shortName = b => (b.length <= 2 ? b : b === '机械革命' ? '机械' : b === '任天堂' ? '任' : b.slice(0, 2));

  // 涨跌：真实产品来自上一份报价单，这里按 id 生成确定值占位
  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  ITEMS.forEach(it => {
    it.prev = it.max == null ? null : Math.round(it.max * (1 + (((hash(it.id + 'prev') % 160) - 80) / 10000)));
  });

  const WATCH_KEY = 'sjw.watch.v2';
  const watched = new Set((() => { try { return JSON.parse(localStorage.getItem(WATCH_KEY) || '[]'); } catch { return []; } })());

  const S = { cat: '全部', brand: '全部', q: '', sort: 'default', onlyPriced: false, onlyWatched: false, typeKey: null };

  /* ---------------- 小工具 ---------------- */
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = n => n == null ? '—' : n.toLocaleString('zh-CN');

  // 型号名和规格分开：手机/平板/穿戴把 12+512 抠出来做 chip，电脑保留整串
  function splitName(it) {
    if (!['手机', '平板', '穿戴', '音频', '配件'].includes(it.category) || !it.storage) return [it.head, null];
    const re = new RegExp('\\s*' + it.storage.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*');
    const pure = it.head.replace(re, ' ').replace(/\s+/g, ' ').trim();
    return pure && pure !== it.head ? [pure, it.storage] : [it.head, null];
  }

  function priceHTML(it) {
    if (it.min == null) return `<strong class="masked">停收</strong><span class="delta flat">当日不收</span>`;
    const masks = it.offers.filter(o => o.mask).map(o => o.mask);
    const allMasked = masks.length === it.offers.length && masks.length > 0;

    if (allMasked && new Set(masks).size === 1) {
      const m = masks[0];
      const digits = m.replace(/\*/g, '');
      return `<strong class="masked">${digits}<small>${'x'.repeat(m.length - digits.length)}</small></strong>
        <span class="range">${num(it.min)}–${num(it.max)}</span>${deltaHTML(it)}`;
    }
    const main = it.min === it.max ? num(it.min) : num(it.min);
    const unit = it.min === it.max ? '<small>元</small>' : '<small>元起</small>';
    const range = it.min === it.max ? '' : `<span class="range">${num(it.min)}–${num(it.max)}</span>`;
    return `<strong>${main}${unit}</strong>${range}${deltaHTML(it)}`;
  }

  function deltaHTML(it) {
    if (it.prev == null || it.max == null) return '';
    const d = it.max - it.prev;
    if (!d) return '<span class="delta flat">持平</span>';
    const pct = (Math.abs(d / it.prev) * 100).toFixed(1).replace(/\.0$/, '');
    const tail = pct === '0' ? ' 元' : ` ${pct}%`;
    return d > 0
      ? `<span class="delta up">↑${num(d)}${tail}</span>`
      : `<span class="delta down">↓${num(-d)}${tail}</span>`;
  }

  const haystack = it => [it.head, it.brand, it.series, it.category, it.conditions.join(' '),
    it.offers.map(o => o.colors.join('')).join(' '), it.typeLabel].join(' ').toLowerCase();
  const matchesQuery = it => !S.q || haystack(it).includes(S.q.toLowerCase());

  function filtered() {
    let out = ITEMS.filter(it =>
      (S.cat === '全部' || it.category === S.cat) &&
      (S.brand === '全部' || it.brand === S.brand) &&
      (!S.typeKey || it.typeKey === S.typeKey) &&
      (!S.onlyPriced || it.min != null) &&
      (!S.onlyWatched || watched.has(it.id)) &&
      matchesQuery(it));
    if (S.sort === 'asc') out = out.slice().sort((a, b) => (a.min ?? 1e9) - (b.min ?? 1e9));
    if (S.sort === 'desc') out = out.slice().sort((a, b) => (b.max ?? -1) - (a.max ?? -1));
    return out;
  }

  /* ---------------- 渲染 ---------------- */
  function renderCats() {
    $('#cats').innerHTML = CATS.map(c => {
      const n = c === '全部' ? ITEMS.length : ITEMS.filter(i => i.category === c).length;
      return `<button class="cat ${c === S.cat ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)}<b>${n}</b></button>`;
    }).join('');
  }

  function renderBrands() {
    const pool = ITEMS.filter(it => (S.cat === '全部' || it.category === S.cat) && matchesQuery(it));
    $('#brands').innerHTML = BRANDS.map(b => {
      const n = b === '全部' ? pool.length : pool.filter(i => i.brand === b).length;
      if (b !== '全部' && !n) return '';
      return `<button class="brand ${b === S.brand ? 'on' : ''}" data-brand="${esc(b)}"><b>${esc(b)}</b><small>${n}</small></button>`;
    }).join('');
  }

  function cardHTML(it, i) {
    const [name, sto] = splitName(it);
    const tags = [];
    if (it.typeKey !== 'recycle') tags.push(`<span class="tag ${it.typeKey === 'agency' ? 'agency' : 'wholesale'}">${esc(it.typeLabel)}</span>`);
    it.conditions.slice(0, 3).forEach(c => tags.push(`<span class="tag warn">${esc(c)}</span>`));
    if (it.variant) tags.push(`<span class="tag gray">${esc(it.variant)}</span>`);
    if (!tags.length) {
      const cn = it.offers.reduce((n, o) => n + (o.colors.length || 0), 0);
      tags.push(`<span class="tag ${it.min == null ? 'warn' : ''}">${it.min == null ? '停收' : cn + ' 个配色'}</span>`);
    }
    return `<article class="card ${it.min == null ? 'dead' : ''}" data-id="${esc(it.id)}" style="animation-delay:${Math.min(i, 12) * 12}ms">
      <div class="thumb ${shortName(it.brand).length > 2 ? 'sm' : ''}" style="${thumbStyle(it.brand)}">${esc(shortName(it.brand))}</div>
      <div class="mid">
        <h4>${watched.has(it.id) ? '<span class="star">★</span>' : ''}${esc(name)}${sto ? `<span class="sto">${esc(sto)}</span>` : ''}</h4>
        <div class="tags">${tags.join('')}</div>
      </div>
      <div class="price">${priceHTML(it)}</div>
    </article>`;
  }

  function renderRows(skeleton) {
    const list = filtered();
    $('#countText').textContent = `${list.length} 个机型 · ${new Set(list.map(i => i.brand)).size} 个品牌`;
    const box = $('#rows');

    if (skeleton) {
      box.innerHTML = Array.from({ length: 7 }).map(() => `
        <div class="sk-card">
          <div class="sk" style="width:42px;height:42px;border-radius:12px"></div>
          <div style="flex:1">
            <div class="sk" style="height:13px;width:60%"></div>
            <div class="sk" style="height:10px;width:36%;margin-top:7px"></div>
          </div>
          <div class="sk" style="width:56px;height:20px"></div>
        </div>`).join('');
      return;
    }

    if (!list.length) {
      box.innerHTML = `<div class="empty">
        <svg viewBox="0 0 64 64" width="58" height="58"><rect x="12" y="10" width="40" height="44" rx="7" fill="none" stroke="#c7cfdc" stroke-width="2.4"/><path d="M22 26h20M22 34h14" stroke="#c7cfdc" stroke-width="2.4" stroke-linecap="round"/></svg>
        <div>没找到这个机型</div><div style="font-size:11.5px">换个关键词，或关掉「只看有价」</div></div>`;
      return;
    }

    if (S.sort !== 'default') {
      box.innerHTML = list.map((it, i) => {
        const h = `<div class="shead"><span class="sbrand">${esc(it.brand)}</span><span class="ssep">/</span><span class="sname">${esc(it.series)}</span></div>`;
        return (i === 0 || list[i - 1].seriesKey !== it.seriesKey ? h : '') + cardHTML(it, i);
      }).join('') + FOOT;
      return;
    }

    const groups = new Map();
    list.forEach(it => { if (!groups.has(it.seriesKey)) groups.set(it.seriesKey, []); groups.get(it.seriesKey).push(it); });

    let html = '', idx = 0;
    for (const [, items] of groups) {
      const h = items[0];
      const cls = h.typeKey === 'agency' ? 'agency' : h.typeKey === 'wholesale' ? 'wholesale' : '';
      html += `<div class="shead">
        <span class="sbrand">${esc(h.brand)}</span><span class="ssep">/</span><span class="sname">${esc(h.series)}</span>
        <span class="badge ${cls}">${esc(h.typeLabel)}</span>
        <span class="scount">${items.length} 款</span></div>`;
      html += items.map(it => cardHTML(it, idx++)).join('');
    }
    box.innerHTML = html + FOOT;
  }

  const FOOT = `<div class="foot">数据源：郑州鑫盛 2026-11-21 微信报价单 · 与商家原文逐行一致<br/>价格为当日结算价 · 遮码价显示为 34xx · 停收 = 当日不收该配色</div>`;

  function renderAll(skeleton) { renderCats(); renderBrands(); renderRows(skeleton); }

  /* ---------------- 抽屉 ---------------- */
  const mask = $('#mask'), sheet = $('#sheet');
  const closeSheet = () => { mask.hidden = true; sheet.hidden = true; sheet.innerHTML = ''; };
  mask.addEventListener('click', closeSheet);

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 1700);
  }

  function drawSpark(cv, base, seed) {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    const c = cv.getContext('2d');
    c.scale(dpr, dpr);
    // 近 7 日（占位）：以当日价为锚点做确定性波动
    const pts = [];
    for (let i = 0; i < 7; i++) {
      const r = ((hash(seed + i) % 100) / 100 - .5) * 0.028;
      pts.push(base * (1 + r + (i - 6) * -0.0012));
    }
    pts[6] = base;
    const min = Math.min(...pts), max = Math.max(...pts);
    const span = max - min || 1;
    const X = i => (i / 6) * (w - 8) + 4;
    const Y = v => h - 8 - ((v - min) / span) * (h - 18);

    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, 'rgba(43,98,246,.20)');
    g.addColorStop(1, 'rgba(43,98,246,0)');
    c.beginPath(); c.moveTo(X(0), h);
    pts.forEach((v, i) => c.lineTo(X(i), Y(v)));
    c.lineTo(X(6), h); c.closePath(); c.fillStyle = g; c.fill();

    c.beginPath();
    pts.forEach((v, i) => i ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)));
    c.strokeStyle = '#2b62f6'; c.lineWidth = 2; c.lineJoin = 'round'; c.stroke();

    c.beginPath(); c.arc(X(6), Y(pts[6]), 3.2, 0, Math.PI * 2);
    c.fillStyle = '#fff'; c.fill(); c.strokeStyle = '#2b62f6'; c.lineWidth = 2.2; c.stroke();
  }

  function openDetail(it) {
    const [name, sto] = splitName(it);
    const c = BRAND[it.brand] || [[90, 100, 116], [140, 150, 168]];
    const headBg = `background:linear-gradient(180deg,rgba(${c[0].join(',')},.16) 0%,rgba(${c[0].join(',')},.05) 58%,#fff 100%)`;
    const brandPill = `background:linear-gradient(140deg,rgb(${c[0]}) 0%,rgb(${c[1]}) 100%)`;
    const chips = it.offers.map(o => {
      const label = o.colors.length ? o.colors.join(' ') : '统一价';
      if (o.value == null) return `<div class="cchip dead"><em>${esc(label)}</em><b>停收</b></div>`;
      const val = o.mask ? o.mask.replace(/\*/g, 'x') : num(o.value);
      return `<div class="cchip"><em>${esc(label)}</em><b>${val}</b></div>`;
    }).join('');

    const kv = [
      ['品类 / 品牌', `${it.category} · ${it.brand}`],
      ['规格', it.storage || '—'],
      ['价格类型', it.typeLabel],
      ['当日条件', it.conditions.length ? it.conditions.join('、') : '无'],
      ['官方指导价', it.msrp ? num(it.msrp) + ' 元' : '—'],
      ['昨日对比', it.prev == null ? '—' : num(it.prev) + ' 元'],
      ['报价日期', '2026-11-21'],
      ['报价商家', D.meta.merchant || '—'],
    ].map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');

    const priceLine = it.min == null ? '停收'
      : (it.min === it.max ? num(it.min) + '<span>元</span>' : num(it.min) + '<span>元起</span>');

    sheet.innerHTML = `
      <div class="grab"></div>
      <div class="dh" style="${headBg}">
        <div class="dh-name">${esc(name)}${sto ? ` ${esc(sto)}` : ''}</div>
        <div class="dh-price">${priceLine}</div>
        <div class="dh-sub">
          <span class="pill" style="${brandPill};color:#fff;border-color:transparent">${esc(it.brand)}</span>
          <span>${esc(it.typeLabel)}</span><span>·</span><span>11.21 结算价</span><span>·</span><span>${esc(it.series)}</span>
        </div>
      </div>
      ${it.max != null ? `<div class="spark-box"><h5>近 7 日报价<em>演示数据</em></h5><canvas class="spark" id="spark"></canvas></div>` : ''}
      <div class="sec">分色报价<span>${it.offers.length} 条</span></div>
      <div class="colors">${chips}</div>
      <div class="sec">明细</div>
      <div class="kv">${kv}</div>
      <div class="sec">原始报价行</div>
      <pre class="raw">${esc(it.source)}</pre>
      <div class="acts">
        <button class="${watched.has(it.id) ? 'watched' : ''}" id="btnWatch">${watched.has(it.id) ? '★ 已关注' : '☆ 关注'}</button>
        <button class="primary" id="btnCopy">复制报价</button>
      </div>`;

    mask.hidden = false; sheet.hidden = false;
    const cv = $('#spark');
    if (cv) requestAnimationFrame(() => drawSpark(cv, it.max, it.id));

    $('#btnWatch').addEventListener('click', e => {
      watched.has(it.id) ? watched.delete(it.id) : watched.add(it.id);
      localStorage.setItem(WATCH_KEY, JSON.stringify([...watched]));
      const on = watched.has(it.id);
      e.currentTarget.textContent = on ? '★ 已关注' : '☆ 关注';
      e.currentTarget.classList.toggle('watched', on);
      renderRows();
    });
    $('#btnCopy').addEventListener('click', async () => {
      const txt = `${it.head} ${it.min == null ? '停收' : num(it.min) + '-' + num(it.max) + '元'} ${it.typeLabel}（11.21）`;
      try { await navigator.clipboard.writeText(txt); toast('已复制 ' + txt); }
      catch { prompt('复制这段：', txt); }
    });
  }

  function openRaw() {
    let html = '';
    D.series.forEach(s => {
      html += `<div class="rgroup"><h6>${esc(s.brand)} / ${esc(s.series)} · ${esc(s.typeLabel)}</h6>
        <pre>${s.items.map(i => esc(i.source)).join('\n')}</pre></div>`;
    });
    sheet.innerHTML = `<div class="grab"></div>
      <div class="rawsheet">
        <h3>报价原文</h3>
        <div class="note">${esc(D.meta.merchant)} · ${esc(D.meta.date)} · ${ITEMS.length} 行，与商家发出的报价单逐行一致</div>
        ${html}
      </div>`;
    mask.hidden = false; sheet.hidden = false;
  }

  function openFilter() {
    const types = [['全部', null], ['回收价', 'recycle'], ['出货价', 'wholesale'], ['代卖价', 'agency']];
    sheet.innerHTML = `<div class="grab"></div>
      <div class="fsheet">
        <h3>筛选</h3>
        <div class="note">条件叠加生效</div>
        <div class="fgroup"><h4>价格类型</h4><div class="opts">
          ${types.map(([l, k]) => `<button class="opt ${S.typeKey === k ? 'on' : ''}" data-type="${k ?? ''}">${l}${k ? `<i>${ITEMS.filter(i => i.typeKey === k).length}</i>` : ''}</button>`).join('')}
        </div></div>
        <div class="fgroup"><h4>显示</h4><div class="opts">
          <button class="opt ${S.onlyPriced ? 'on' : ''}" data-toggle="onlyPriced">只看有价</button>
          <button class="opt ${S.onlyWatched ? 'on' : ''}" data-toggle="onlyWatched">只看关注<i>${watched.size}</i></button>
        </div></div>
        <div class="facts">
          <button id="btnReset">重置</button>
          <button class="primary" id="btnDone">看 ${filtered().length} 个结果</button>
        </div>
      </div>`;
    mask.hidden = false; sheet.hidden = false;

    const refresh = () => { $('#btnDone').textContent = `看 ${filtered().length} 个结果`; };
    sheet.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => {
      S.typeKey = b.dataset.type || null;
      sheet.querySelectorAll('[data-type]').forEach(x => x.classList.toggle('on', x === b));
      refresh();
    }));
    sheet.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.toggle; S[k] = !S[k];
      b.classList.toggle('on', S[k]);
      refresh();
    }));
    $('#btnReset').addEventListener('click', () => {
      S.typeKey = null; S.onlyPriced = false; S.onlyWatched = false;
      closeSheet(); renderAll(); openFilter();
    });
    $('#btnDone').addEventListener('click', () => { closeSheet(); renderAll(); });
  }

  /* ---------------- 事件 ---------------- */
  document.addEventListener('click', e => {
    const cat = e.target.closest('[data-cat]');
    if (cat) { S.cat = cat.dataset.cat; S.brand = '全部'; renderAll(); return; }
    const br = e.target.closest('[data-brand]');
    if (br) { S.brand = br.dataset.brand; renderBrands(); renderRows(); $('#rows').scrollTop = 0; return; }
    const card = e.target.closest('.card[data-id]');
    if (card) { const it = ITEMS.find(x => x.id === card.dataset.id); if (it) openDetail(it); return; }
    const seg = e.target.closest('[data-sort]');
    if (seg) {
      S.sort = seg.dataset.sort;
      document.querySelectorAll('#segSort button').forEach(b => b.classList.toggle('on', b === seg));
      renderRows(); $('#rows').scrollTop = 0; return;
    }
    const tab = e.target.closest('#tabbar button');
    if (tab && tab.dataset.tab !== 'market') toast('复刻演示：只做了「行情」模块');
  });

  $('#q').addEventListener('input', e => {
    S.q = e.target.value.trim();
    $('#btnClear').hidden = !S.q;
    renderBrands(); renderRows();
  });
  $('#btnClear').addEventListener('click', () => {
    $('#q').value = ''; S.q = ''; $('#btnClear').hidden = true;
    renderBrands(); renderRows();
  });
  $('#btnFilter').addEventListener('click', openFilter);
  $('#btnRaw').addEventListener('click', openRaw);
  $('#btnCity').addEventListener('click', () => toast('复刻演示：郑州单站'));
  $('#dateText').textContent = (D.meta.date || '').slice(5).replace('-', '.') || '—';

  /* ---------------- 启动 ---------------- */
  renderAll(true);
  setTimeout(() => {
    renderAll(false);
    if (location.hash.startsWith('#detail=')) {
      const it = ITEMS.find(x => x.id === decodeURIComponent(location.hash.slice(8)));
      if (it) openDetail(it);
    } else if (location.hash === '#filter') openFilter();
    else if (location.hash === '#raw') openRaw();
  }, 260);
})();

</script>
</body>
</html>
